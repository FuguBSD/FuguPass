name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The format gate runs prettier through bunx.
      - name: Setup bun
        uses: FuguBSD/Tooling/actions/setup-bun@main

      # make check runs the Perl gates over bin/ and t/, so the job
      # takes the test environment. The action installs it, and the
      # chain also brings the gitleaks of the secret gate. That gate
      # scans the full git history, so the checkout above stays at
      # fetch-depth 0 (WFL-GITLEAKS-2).
      - name: Setup Perl
        uses: FuguBSD/Tooling/perl/actions/setup-perl@main
        with:
          dependencies: test

      - name: Check
        run: make check

      - name: Drift gate
        if: github.event_name == 'pull_request'
        run: scripts/spec-check --drift "origin/${{ github.base_ref }}"

  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FuguBSD/Tooling
        uses: actions/checkout@v4
        with:
          repository: FuguBSD/Tooling
          path: tooling

      # The synced copies must match FuguBSD/Tooling exactly.
      - name: Verify the synced copies
        run: ./tooling/scripts/sync --check
